# Every 6 hours: read ncert.nic.in, update the catalogue, publish the app to GitHub Pages.
# Large working files (crawl + link checks) live in the Actions cache, so the repository stays small;
# only data/ and the change history are committed, and only when something changed.
name: Sync with NCERT

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      full_check:
        description: "Re-check every file link (slow, ~30 min)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        working-directory: sync
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sync/requirements.txt

      - run: pip install -r requirements.txt

      - name: Restore working state
        uses: actions/cache/restore@v4
        with:
          path: |
            sync/state/crawl_state.json
            sync/state/link_status.json
            sync/state/textbooks_state.json
            sync/state/youtube_state.json
          key: ncert-state-${{ github.run_id }}
          restore-keys: ncert-state-

      - name: Crawl ncert.nic.in
        run: python crawl.py --fresh

      - name: Check file links
        run: python check_links.py ${{ inputs.full_check && '--all' || '' }}

      - name: Textbooks
        run: python textbooks.py

      - name: YouTube channels
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python youtube.py

      - name: Save working state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            sync/state/crawl_state.json
            sync/state/link_status.json
            sync/state/textbooks_state.json
            sync/state/youtube_state.json
          key: ncert-state-${{ github.run_id }}

      - name: Export app data
        run: python export.py

      - name: Analysis report (Excel)
        run: python build_report.py

      - name: Build site
        run: python build_site.py

      - name: Commit changed data
        working-directory: .
        run: |
          git config user.name "ncert-sync-bot"
          git config user.email "ncert-sync-bot@users.noreply.github.com"
          git add data sync/state/history.json
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "Sync NCERT data $(date -u +%Y-%m-%dT%H:%MZ)" && git push
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ncert-report
          path: reports/
          retention-days: 14

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Report a failed sync
        if: failure()
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create sync-failure --color B60205 --description "Scheduled NCERT sync failed" --force
          gh issue list --label sync-failure --state open --json number -q '.[0].number' | grep -q . || \
          gh issue create --label sync-failure --title "NCERT sync failed" \
            --body "The scheduled sync failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. If export refused to publish, NCERT's site may have changed shape – the app keeps showing the last good data."

  deploy:
    needs: sync
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
